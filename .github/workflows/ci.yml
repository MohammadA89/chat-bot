name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` runs `tsc -b` first, so this covers the type check too.
      - name: Type check and build
        run: npm run build

      - name: Bridge self-test
        run: npm run bridge:self-test
